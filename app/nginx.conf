# Rendered by pms-start (__PORT__ is replaced with $PORT).
worker_processes 2;
pid /run/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;
    server_tokens off;
    client_max_body_size 108M;
    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    map $request_uri $pms_api_uri {
        ~^/api(?<rest>/.*)$ $rest;
        default /;
    }

    server {
        listen __PORT__;
        listen [::]:__PORT__;
        root /srv/front;
        index index.html;

        # Health check: answers only when PHP-FPM is up (started after migrations finish).
        location = /healthz {
            fastcgi_param SCRIPT_FILENAME /fpm-ping;
            fastcgi_param SCRIPT_NAME /fpm-ping;
            fastcgi_param REQUEST_METHOD GET;
            fastcgi_pass 127.0.0.1:9000;
        }

        # The owner account is created by the start script on the first boot;
        # nobody else can register, even before that.
        location = /api/register-user {
            allow 127.0.0.1;
            allow ::1;
            deny all;
            include /etc/nginx/fastcgi_pms;
        }

        location ^~ /api/ {
            include /etc/nginx/fastcgi_pms;
        }

        location = /index.html {
            add_header Cache-Control "no-cache";
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
