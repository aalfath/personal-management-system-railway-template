; Railway wrapper settings for Personal Management System
memory_limit = 256M
upload_max_filesize = 100M
post_max_size = 108M
max_execution_time = 120
expose_php = Off
opcache.enable = 1
opcache.memory_consumption = 96
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
; Doctrine's cache pools use APCu, also from bin/console.
apc.enabled = 1
apc.enable_cli = 1
apc.shm_size = 32M
