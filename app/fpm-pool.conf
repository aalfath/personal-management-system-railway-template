[global]
daemonize = no
error_log = /proc/self/fd/2

[www]
chdir = /app/public
listen = 127.0.0.1:9000
user = www-data
group = www-data
pm = dynamic
pm.max_children = 6
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500
ping.path = /fpm-ping
ping.response = pong
access.log = /dev/null
catch_workers_output = yes
clear_env = no
decorate_workers_output = no
